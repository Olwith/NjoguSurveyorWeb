<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Admin Dashboard - Njogu Surveyor</title>
  <meta name="robots" content="noindex, nofollow">
  <link rel="preconnect" href="https://fonts.bunny.net" crossorigin>
  <link rel="stylesheet" href="https://fonts.bunny.net/css?family=inter:400,500,600,700,800&display=swap">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css" crossorigin="anonymous" />
  <style>
    :root {
      --primary: #1e40af;
      --primary-dark: #1e3a8a;
      --secondary: #dc2626;
      --light: #f8fafc;
      --dark: #0f172a;
      --muted: #64748b;
      --shadow: 0 4px 12px rgba(0,0,0,0.1);
      --radius: 8px;
      --transition: all 0.2s ease;
      --font: 'Inter', system-ui, sans-serif;
    }
    [data-theme="dark"] {
      --primary: #3b82f6;
      --primary-dark: #1d4ed8;
      --light: #1e293b;
      --dark: #f1f5f9;
      --muted: #94a3b8;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: var(--font);
      background: var(--light);
      color: var(--dark);
      line-height: 1.6;
    }
    .container { max-width: 1100px; margin: 0 auto; padding: 0 20px; }
    
    /* Admin Dashboard Styles */
    .admin-header {
      background: var(--primary-dark); color: #fff; padding: 16px 0;
      display: flex; justify-content: space-between; align-items: center;
    }
    .admin-header h1 { font-size: 1.5rem; }
    .warning-banner {
      background: #fef3c7; color: #92400e; padding: 12px 20px;
      text-align: center; font-weight: 600; border-bottom: 1px solid #fcd34d;
      font-size: 0.9rem;
    }
    .warning-banner i { margin-right: 6px; }
    
    .admin-content { padding: 32px 0; }
    .admin-grid { display: grid; grid-template-columns: 1fr 1.5fr; gap: 32px; }
    @media (max-width: 900px) { .admin-grid { grid-template-columns: 1fr; } }
    
    .card { background: #fff; border-radius: 12px; padding: 24px; box-shadow: var(--shadow); margin-bottom: 24px; }
    .card h2 { font-size: 1.3rem; margin-bottom: 20px; padding-bottom: 12px; border-bottom: 2px solid #f1f5f9; }
    
    .post-form textarea { min-height: 150px; resize: vertical; }
    .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
    @media (max-width: 600px) { .form-row { grid-template-columns: 1fr; } }
    
    .post-list { width: 100%; border-collapse: collapse; font-size: 0.9rem; }
    .post-list th { text-align: left; padding: 12px; background: #f8fafc; font-weight: 600; border-bottom: 2px solid #e2e8f0; }
    .post-list td { padding: 12px; border-bottom: 1px solid #e2e8f0; vertical-align: middle; }
    .post-list tr:hover { background: #f8fafc; }
    .post-actions { display: flex; gap: 8px; }
    .badge { padding: 4px 8px; border-radius: 50px; font-size: 0.75rem; font-weight: 600; background: rgba(30,64,175,0.1); color: var(--primary); }
    
    .loading { text-align: center; padding: 40px; color: var(--muted); }
    .empty-state { text-align: center; padding: 40px; color: var(--muted); }
    .empty-state i { font-size: 2rem; margin-bottom: 12px; display: block; }
    
    .alert { padding: 12px; border-radius: var(--radius); margin-bottom: 16px; font-size: 0.9rem; display: none; }
    .alert-error { background: #fee2e2; color: #b91c1c; border: 1px solid #fecaca; }
    .alert-success { background: #dcfce7; color: #15803d; border: 1px solid #bbf7d0; }
    
    .btn {
      padding: 12px 24px; border: none; border-radius: var(--radius);
      font-weight: 600; cursor: pointer; transition: var(--transition);
      font-size: 0.95rem; display: inline-flex; align-items: center; justify-content: center; gap: 8px;
    }
    .btn-primary { background: var(--primary); color: #fff; }
    .btn-primary:hover { background: var(--primary-dark); }
    .btn-danger { background: var(--secondary); color: #fff; }
    .btn-danger:hover { opacity: 0.9; }
    .btn-sm { padding: 8px 16px; font-size: 0.85rem; }
    .btn-block { width: 100%; }
  </style>
</head>
<body>

  <!-- ⚠️ SECURITY WARNING BANNER -->
  <div class="warning-banner">
    <i class="fas fa-exclamation-triangle"></i>
    DEVELOPMENT MODE: No authentication enabled. Re-enable login before going live.
  </div>

  <!-- ADMIN DASHBOARD (Always Visible) -->
  <div id="adminDashboard">
    <header class="admin-header">
      <div class="container" style="display:flex;justify-content:space-between;align-items:center;width:100%;">
        <h1><i class="fas fa-shield-alt"></i> Blog Admin <span style="font-size:0.9rem;font-weight:400;opacity:0.9">[DEV MODE]</span></h1>
        <!-- Logout button removed - no auth to logout from -->
      </div>
    </header>

    <main class="admin-content">
      <div class="container">
        <div id="statusAlert" class="alert"></div>
        
        <div class="admin-grid">
          <!-- POST FORM -->
          <div class="card">
            <h2><i class="fas fa-pen-nib"></i> Create / Edit Post</h2>
            <form id="postForm" class="post-form">
              <input type="hidden" id="postId">
              
              <div class="form-group">
                <label for="title">Title *</label>
                <input type="text" id="title" class="form-control" required placeholder="Enter blog title">
              </div>

              <div class="form-group">
                <label for="slug">URL Slug *</label>
                <input type="text" id="slug" class="form-control" required placeholder="e.g., how-to-read-survey-plan">
              </div>

              <div class="form-row">
                <div class="form-group">
                  <label for="author">Author *</label>
                  <input type="text" id="author" class="form-control" value="Njogu Surveyor Team" required>
                </div>
                <div class="form-group">
                  <label for="category">Category *</label>
                  <select id="category" class="form-control" required>
                    <option value="land">Land & Subdivision</option>
                    <option value="titles">Title Deeds</option>
                    <option value="buying">Buying & Selling</option>
                    <option value="legal">Legal & Policy</option>
                    <option value="planning">Planning & Zoning</option>
                    <option value="development">Development</option>
                  </select>
                </div>
              </div>

              <div class="form-group">
                <label for="publishedDate">Publish Date *</label>
                <input type="date" id="publishedDate" class="form-control" required>
              </div>

              <div class="form-group">
                <label for="excerpt">Short Excerpt *</label>
                <textarea id="excerpt" class="form-control" rows="3" required placeholder="Brief summary for blog cards (150 chars max)"></textarea>
              </div>

              <div class="form-group">
                <label for="imageUrl">Featured Image URL *</label>
                <input type="url" id="imageUrl" class="form-control" required placeholder="https://images.unsplash.com/...">
              </div>

              <div class="form-group">
                <label for="content">Full Content (HTML) *</label>
                <textarea id="content" class="form-control" rows="12" required placeholder="<p>Write your full blog post here...</p>"></textarea>
              </div>

              <button type="submit" class="btn btn-primary btn-block" id="submitBtn">
                <i class="fas fa-paper-plane"></i> Publish Post
              </button>
            </form>
          </div>

          <!-- POSTS LIST -->
          <div class="card">
            <h2><i class="fas fa-list"></i> All Posts</h2>
            <div id="postsLoader" class="loading"><i class="fas fa-spinner fa-spin"></i> Loading posts...</div>
            <table class="post-list" id="postsTable" style="display:none;">
              <thead>
                <tr>
                  <th>Title</th>
                  <th>Category</th>
                  <th>Date</th>
                  <th>Actions</th>
                </tr>
              </thead>
              <tbody id="postsBody"></tbody>
            </table>
            <div id="emptyState" class="empty-state" style="display:none;">
              <i class="fas fa-folder-open"></i>
              <p>No blog posts found. Create your first one!</p>
            </div>
          </div>
        </div>
      </div>
    </main>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    // ===== CONFIGURATION =====
    // ⚠️ FIX: Corrected typo in URL (was "supaabse" → "supabase")
    const SUPABASE_URL = 'https://cfnqxskcrfrwqtgldovg.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImNmbnF4c2tjcmZyd3F0Z2xkb3ZnIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzc4ODg1NDUsImV4cCI6MjA5MzQ2NDU0NX0.XeA-8nkaQmIn_o6hSXEredFA0VDCJNylt50kp7UK2ng';
    
    // Initialize Supabase client
    const supabase = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    // ===== DOM ELEMENTS =====
    const adminDashboard = document.getElementById('adminDashboard');
    const postForm = document.getElementById('postForm');
    const statusAlert = document.getElementById('statusAlert');
    const postsTable = document.getElementById('postsTable');
    const postsBody = document.getElementById('postsBody');
    const postsLoader = document.getElementById('postsLoader');
    const emptyState = document.getElementById('emptyState');
    const titleInput = document.getElementById('title');
    const slugInput = document.getElementById('slug');
    const publishedDateInput = document.getElementById('publishedDate');

    // ===== INITIALIZATION =====
    publishedDateInput.valueAsDate = new Date();
    
    // Show dashboard immediately (no auth check)
    adminDashboard.style.display = 'block';
    loadPosts();

    function showAlert(element, message, type = 'error') {
      element.textContent = message;
      element.className = `alert alert-${type}`;
      element.style.display = 'block';
      setTimeout(() => element.style.display = 'none', 5000);
    }

    // ===== SLUG GENERATOR =====
    titleInput.addEventListener('input', () => {
      const slug = titleInput.value
        .toLowerCase()
        .trim()
        .replace(/[^\w\s-]/g, '')
        .replace(/[\s_-]+/g, '-')
        .replace(/^-+|-+$/g, '');
      slugInput.value = slug;
    });

    // ===== CRUD OPERATIONS =====
    async function loadPosts() {
      postsLoader.style.display = 'block';
      postsTable.style.display = 'none';
      emptyState.style.display = 'none';

      const { data, error } = await supabase
        .from('blog_posts')
        .select('id, title, slug, category, created_at')
        .order('created_at', { ascending: false });

      postsLoader.style.display = 'none';

      if (error) {
        console.error('Load posts error:', error);
        showAlert(statusAlert, `Failed to load posts: ${error.message}`, 'error');
        return;
      }

      if (!data || data.length === 0) {
        emptyState.style.display = 'block';
        return;
      }

      postsBody.innerHTML = '';
      data.forEach(post => {
        const date = new Date(post.created_at).toLocaleDateString('en-KE', { year: 'numeric', month: 'short', day: 'numeric' });
        const row = document.createElement('tr');
        row.innerHTML = `
          <td><strong>${post.title}</strong><br><small style="color:var(--muted)">${post.slug}</small></td>
          <td><span class="badge">${post.category}</span></td>
          <td>${date}</td>
          <td class="post-actions">
            <button class="btn btn-sm btn-primary edit-btn" data-id="${post.id}"><i class="fas fa-edit"></i></button>
            <button class="btn btn-sm btn-danger delete-btn" data-id="${post.id}"><i class="fas fa-trash"></i></button>
          </td>
        `;
        postsBody.appendChild(row);
      });

      postsTable.style.display = 'table';

      // Attach event listeners
      document.querySelectorAll('.edit-btn').forEach(btn => {
        btn.addEventListener('click', () => editPost(btn.dataset.id));
      });
      document.querySelectorAll('.delete-btn').forEach(btn => {
        btn.addEventListener('click', () => deletePost(btn.dataset.id));
      });
    }

    postForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      const submitBtn = document.getElementById('submitBtn');
      submitBtn.disabled = true;
      submitBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Saving...';

      const postData = {
        title: document.getElementById('title').value,
        slug: document.getElementById('slug').value,
        author: document.getElementById('author').value,
        category: document.getElementById('category').value,
        excerpt: document.getElementById('excerpt').value,
        image_url: document.getElementById('imageUrl').value,
        content: document.getElementById('content').value,
        published_at: document.getElementById('publishedDate').value
      };

      const postId = document.getElementById('postId').value;
      let error;

      if (postId) {
        // Update existing
        const res = await supabase.from('blog_posts').update(postData).eq('id', postId);
        error = res.error;
      } else {
        // Insert new
        const res = await supabase.from('blog_posts').insert([postData]);
        error = res.error;
      }

      submitBtn.disabled = false;
      submitBtn.innerHTML = '<i class="fas fa-paper-plane"></i> Publish Post';

      if (error) {
        console.error('Save error:', error);
        showAlert(statusAlert, `Error: ${error.message}`, 'error');
      } else {
        showAlert(statusAlert, postId ? 'Post updated successfully!' : 'New post published!', 'success');
        postForm.reset();
        document.getElementById('postId').value = '';
        publishedDateInput.valueAsDate = new Date();
        document.getElementById('author').value = 'Njogu Surveyor Team';
        loadPosts();
      }
    });

    async function editPost(id) {
      const { data, error } = await supabase.from('blog_posts').select('*').eq('id', id).single();
      if (error) {
        console.error('Edit load error:', error);
        showAlert(statusAlert, 'Failed to load post for editing.', 'error');
        return;
      }

      document.getElementById('postId').value = data.id;
      document.getElementById('title').value = data.title;
      document.getElementById('slug').value = data.slug;
      document.getElementById('author').value = data.author || 'Njogu Surveyor Team';
      document.getElementById('category').value = data.category;
      document.getElementById('publishedDate').value = data.published_at || data.created_at.split('T')[0];
      document.getElementById('excerpt').value = data.excerpt;
      document.getElementById('imageUrl').value = data.image_url;
      document.getElementById('content').value = data.content;
      
      document.getElementById('submitBtn').innerHTML = '<i class="fas fa-save"></i> Update Post';
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    async function deletePost(id) {
      if (!confirm('Are you sure you want to delete this post? This cannot be undone.')) return;

      const { error } = await supabase.from('blog_posts').delete().eq('id', id);
      if (error) {
        console.error('Delete error:', error);
        showAlert(statusAlert, 'Failed to delete post.', 'error');
      } else {
        showAlert(statusAlert, 'Post deleted successfully.', 'success');
        loadPosts();
      }
    }

    // Initialize
    console.log('🔓 Admin dashboard loaded (DEV MODE - no auth)');
  </script>
</body>
</html>
